    <script>
      // Pasang tema sebelum render supaya tidak "berkedip"
      try {
        var t = localStorage.getItem('tema')
        var gelap = t === 'gelap' || (t !== 'terang' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (gelap) document.documentElement.classList.add('dark')
      } catch (e) {}
